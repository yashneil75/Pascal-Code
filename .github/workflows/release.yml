name: Release Builds

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-cuda
            extra_index: https://abetlen.github.io/llama-cpp-python/whl/cu124
            builder_args: --win portable
          - os: windows-latest
            artifact: windows-vulkan
            extra_index: https://abetlen.github.io/llama-cpp-python/whl/vulkan
            builder_args: --win portable
          - os: macos-latest
            artifact: macos-metal
            extra_index: https://abetlen.github.io/llama-cpp-python/whl/metal
            builder_args: --mac dmg
          - os: ubuntu-latest
            artifact: linux-cuda
            extra_index: https://abetlen.github.io/llama-cpp-python/whl/cu124
            builder_args: --linux AppImage
          - os: ubuntu-latest
            artifact: linux-vulkan
            extra_index: https://abetlen.github.io/llama-cpp-python/whl/vulkan
            builder_args: --linux AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          grep -v "llama-cpp-python" backend/requirements.txt > /tmp/req.txt
          pip install --no-cache-dir --retries 5 -r /tmp/req.txt
          pip install --no-cache-dir --retries 5 llama-cpp-python --extra-index-url ${{ matrix.extra_index }}
          pip install --no-cache-dir --retries 5 pyinstaller

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run frontend:build

      - name: Build backend
        run: npm run backend:build

      - name: Build Electron app
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder ${{ matrix.builder_args }} --config.artifactName="Pascal-Code-${{ matrix.artifact }}.\${ext}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          make_latest: true
          files: release/*
